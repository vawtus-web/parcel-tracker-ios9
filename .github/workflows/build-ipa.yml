name: Build iPhone app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NativeApp/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen ldid
      - name: Generate Xcode project
        working-directory: NativeApp
        run: xcodegen generate
      - name: Build for iPhone 4s
        working-directory: NativeApp
        run: |
          set -o pipefail
          xcodebuild -project ParcelTracker.xcodeproj -scheme ParcelTracker \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build ARCHS=armv7 ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=9.0 CODE_SIGNING_ALLOWED=NO \
            | tail -n 80
      - name: Package IPA
        working-directory: NativeApp
        run: |
          APP=build/Build/Products/Release-iphoneos/ParcelTracker.app
          test -d "$APP"
          ldid -S "$APP/ParcelTracker"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr -X ParcelTracker-iOS9.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ParcelTracker-iOS9
          path: NativeApp/ParcelTracker-iOS9.ipa
