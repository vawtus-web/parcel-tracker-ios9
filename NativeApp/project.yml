name: ParcelTracker
options:
  bundleIdPrefix: ua.vawtusweb
  deploymentTarget:
    iOS: "9.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: ua.vawtusweb.parceltracker
    PRODUCT_NAME: ParcelTracker
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "9.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  ParcelTracker:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Посилки
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
